  <path d="M8 9 L15 16 L8 23" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="butt" stroke-linejoin="miter"/>
  <rect x="17" y="20" width="9" height="3.5" fill="#FFFFFF"/>
</svg>
